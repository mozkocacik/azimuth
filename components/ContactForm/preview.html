<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ContactForm</title></head>
<body>
<div class="az-col" style="max-width:900px"><form class="az-form" onsubmit="return false"><div class="az-field az-span-all"><span class="az-label">Salutation</span><div class="az-radios"><label class="az-radio"><input type="radio" name="sal" checked>Ms</label><label class="az-radio"><input type="radio" name="sal">Mr</label><label class="az-radio"><input type="radio" name="sal">No salutation</label></div></div><div class="az-field"><label class="az-label" for="f1">First name<span class="az-req">*</span></label><input class="az-input" id="f1" value="Elif"></div><div class="az-field"><label class="az-label" for="f2">Last name<span class="az-req">*</span></label><input class="az-input" id="f2" value="Kaya"></div><div class="az-field"><label class="az-label" for="f3">Company<span class="az-req">*</span></label><input class="az-input" id="f3" value="Northline Trucks AG"></div><div class="az-field"><label class="az-label" for="f4">Business e-mail<span class="az-req">*</span></label><input class="az-input" id="f4" value="elif.kaya@northline" aria-invalid="true" aria-describedby="f4e"><span class="az-error" id="f4e"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></svg>Enter a complete e-mail address, for example name@company.com.</span></div><div class="az-field"><label class="az-label" for="f5">Country<span class="az-req">*</span></label><select class="az-input az-select" id="f5"><option>Germany</option><option>Türkiye</option></select></div><div class="az-field"><label class="az-label" for="f6">Customer number</label><input class="az-input" id="f6" placeholder="10 digits"><span class="az-help">On your invoice or order confirmation.</span></div><div class="az-field az-span-all"><label class="az-check"><input type="checkbox">I agree that Acme Electronics GmbH stores and uses my data to answer this request. I can withdraw this consent at any time. Details are in the privacy notice.</label></div><div class="az-span-all az-actions"><button class="az-btn az-btn-primary" type="submit">Send request</button></div></form></div>
</body>
</html>
